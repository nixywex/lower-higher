openapi: 3.1.0

info:
  title: Lower-Higher API
  description: >
    REST-API für das Lower-Higher-Spiel. Sie liefert die Fakten für eine Runde
    und berechnet die Punkte.


    Der Multiplayer läuft über Socket.io. Die Events stehen in
    `docs/websocket.md`.
  version: 1.1.0

servers:
  - url: http://localhost:3000
    description: Lokaler Entwicklungsserver

tags:
  - name: Facts
    description: Fakten laden und Runde auswerten (Singleplayer)

paths:
  /api/facts/round:
    get:
      tags:
        - Facts
      summary: Neue Spielrunde starten
      description: Gibt 7 zufällige Fakten ohne Zahlenwerte zurück.
      responses:
        '200':
          description: Liste der Fakten für diese Runde
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FactForClient'
                minItems: 7
                maxItems: 7
              example:
                - id: 3
                  question: 'Wie hoch ist der Eiffelturm in Metern?'
                - id: 7
                  question: 'Wie viele Knochen hat ein erwachsener Mensch?'
                - id: 1
                  question: 'In welchem Jahr wurde die Titanic gebaut?'
                - id: 12
                  question: 'Wie schnell fliegt ein Gepard in km/h?'
                - id: 5
                  question: 'Wie viele Meter tief ist der Mariannengraben?'
                - id: 9
                  question: 'Wie viele Länder gibt es auf der Erde?'
                - id: 2
                  question: 'Wie viele Zähne hat ein erwachsener Mensch?'
        '500':
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 'Unexpected exception'

  /api/facts/submit:
    post:
      tags:
        - Facts
      summary: Sortierung einreichen und Punkte erhalten
      description: >
        Nimmt die Reihenfolge als ID-Array an. Die größte Zahl steht an Position
        0. Der Server berechnet danach die Punkte. Die Zahlenwerte werden erst
        mit dem Ergebnis zurückgegeben.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            example:
              ids: [5, 1, 3, 7, 9, 12, 2]
      responses:
        '200':
          description: Auswertung mit korrekter Reihenfolge und erreichtem Score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
              example:
                rightAnswers:
                  - id: 5
                    question: 'Wie viele Meter tief ist der Mariannengraben?'
                    answer: 11034
                  - id: 1
                    question: 'In welchem Jahr wurde die Titanic gebaut?'
                    answer: 1909
                  - id: 3
                    question: 'Wie hoch ist der Eiffelturm in Metern?'
                    answer: 330
                  - id: 7
                    question: 'Wie viele Knochen hat ein erwachsener Mensch?'
                    answer: 206
                  - id: 9
                    question: 'Wie viele Länder gibt es auf der Erde?'
                    answer: 195
                  - id: 12
                    question: 'Wie schnell fliegt ein Gepard in km/h?'
                    answer: 112
                  - id: 2
                    question: 'Wie viele Zähne hat ein erwachsener Mensch?'
                    answer: 32
                score: 70000
        '400':
          description: Ungültige Eingabe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidFormat:
                  summary: ids kein nicht-leeres Zahlen-Array
                  value:
                    message: 'ids must be a non-empty array of numbers'
                unknownIds:
                  summary: Eine oder mehrere IDs existieren nicht
                  value:
                    message: 'One or more ids do not exist'
        '500':
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 'Unexpected exception'

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: 'Unexpected exception'

    FactForClient:
      type: object
      description: Ein Fakt ohne Zahlenwert
      required:
        - id
        - question
      properties:
        id:
          type: integer
          description: ID des Fakts
          example: 3
        question:
          type: string
          description: Text des Fakts
          example: 'Wie hoch ist der Eiffelturm in Metern?'

    Fact:
      type: object
      description: Ein Fakt mit Zahlenwert
      required:
        - id
        - question
        - answer
      properties:
        id:
          type: integer
          example: 3
        question:
          type: string
          example: 'Wie hoch ist der Eiffelturm in Metern?'
        answer:
          type: number
          description: Zahlenwert für die Sortierung
          example: 330

    SubmitRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: IDs von MAX nach MIN. Index 0 hat den größten Wert.
          items:
            type: integer
          minItems: 7
          maxItems: 7
          example: [5, 1, 3, 7, 9, 12, 2]

    SubmitResponse:
      type: object
      required:
        - rightAnswers
        - score
      properties:
        rightAnswers:
          type: array
          description: Richtige Reihenfolge von MAX nach MIN
          items:
            $ref: '#/components/schemas/Fact'
        score:
          type: integer
          description: Punkte der Runde
          example: 70000

    # --- Multiplayer (Socket.io) ---
    # Vollständige Event-Dokumentation: docs/websocket.md

    RoomCode:
      type: object
      description: Raumcode nach createRoom
      required:
        - code
      properties:
        code:
          type: string
          description: Vierstelliger Code
          example: X7K2

    RoomReady:
      type: object
      description: Startet das Spiel für beide Personen
      required:
        - facts
        - hardcore
      properties:
        facts:
          type: array
          description: Fakten ohne Zahlenwerte
          items:
            $ref: '#/components/schemas/FactForClient'
          minItems: 7
          maxItems: 7
        hardcore:
          type: boolean
          description: Zeigt, ob der Hardcore-Modus aktiv ist

    GameResult:
      type: object
      description: Ergebnis nach der Abgabe von beiden Personen
      required:
        - rightAnswers
        - scores
        - orders
        - hostId
        - guestId
      properties:
        rightAnswers:
          type: array
          description: Richtige Reihenfolge von MAX nach MIN
          items:
            $ref: '#/components/schemas/Fact'
        scores:
          type: object
          description: Punkte pro Socket-ID
          additionalProperties:
            type: integer
          example:
            abc123: 62000
            def456: 81000
        orders:
          type: object
          description: Abgegebene Reihenfolge pro Socket-ID
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Fact'
        hostId:
          type: string
          description: Socket-ID des Hosts
          example: abc123
        guestId:
          type: string
          description: Socket-ID des Gastes
          example: def456

    SocketError:
      $ref: '#/components/schemas/ErrorResponse'
